name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # refresh the Discord member counts four times a day
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # The template itself has no site; your copy builds as soon as Pages is set to "GitHub Actions".
    if: github.repository != 'realworldbuilder/guildhall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-discord.mjs   # skips itself unless the DISCORD_BOT_TOKEN secret is set
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
